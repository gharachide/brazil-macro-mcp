name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit, MCP protocol (HTTP) and STDIO black-box tests
        run: ./mvnw -B -ntp verify
      - name: Example agent (local open model via Ollama, scripted in tests)
        working-directory: examples/ollama-agent
        run: ../../mvnw -B -ntp verify

  container:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build image
        run: docker build -t brazil-macro-mcp:ci .
      - name: Smoke test over HTTP
        run: |
          docker run -d --name mcp -p 8080:8080 brazil-macro-mcp:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/actuator/health > /dev/null; then break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'
          docker logs mcp
          docker rm -f mcp
