name: BCB contract

# Checks the assumptions this server makes about the real Banco Central APIs (payload formats,
# series codes, Focus indicator names). Kept out of the pull request build so that a third-party
# outage never blocks a merge.
on:
  schedule:
    - cron: '17 11 * * 1' # Mondays, 08:17 in Brasília
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Live contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run the test suite against the live BCB APIs
        env:
          BCB_LIVE: 'true'
        run: ./mvnw -B -ntp verify
